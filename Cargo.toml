[package]
name = "gbc-emulator"
version = "0.1.0"
edition = "2021"
description = "Game Boy Color emulator compiled to WebAssembly"
license = "MIT"

[lib]
name = "gbc_emulator"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "gbc-emulator"
path = "src/main.rs"

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AudioContext",
    "AudioDestinationNode",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "EventTarget",
    "GpuAdapter",
    "GpuBindGroup",
    "GpuBindGroupDescriptor",
    "GpuBindGroupEntry",
    "GpuBindGroupLayout",
    "GpuBuffer",
    "GpuBufferDescriptor",
    "GpuCanvasContext",
    "GpuColorTargetState",
    "GpuCommandEncoder",
    "GpuDevice",
    "GpuDeviceDescriptor",
    "GpuExtent3dDict",
    "GpuFragmentState",
    "GpuPipelineLayout",
    "GpuPipelineLayoutDescriptor",
    "GpuQueue",
    "GpuRenderPassColorAttachment",
    "GpuRenderPassDescriptor",
    "GpuRenderPipeline",
    "GpuRenderPipelineDescriptor",
    "GpuSampler",
    "GpuSamplerDescriptor",
    "GpuShaderModule",
    "GpuShaderModuleDescriptor",
    "GpuTexture",
    "GpuTextureDescriptor",
    "GpuTextureFormat",
    "GpuTextureView",
    "GpuTextureViewDescriptor",
    "GpuVertexState",
    "HtmlCanvasElement",
    "ImageData",
    "Navigator",
    "Window",
] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4"]
